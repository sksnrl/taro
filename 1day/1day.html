<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10131c">
<title>하루 지식</title>
<style>
:root{color-scheme:dark;--bg:#0b0e15;--panel:#141a27;--panel2:#1a2232;--line:#2b3549;--muted:#9aa7bb;--text:#f3f6fb;--accent:#8bd6c8;--gold:#e9c987}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#24354b 0%,#101522 42%,var(--bg) 76%);color:var(--text);font-family: Pretendard,"Noto Sans KR",system-ui,-apple-system,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{width:min(100% - 32px,960px);margin:auto;padding:34px 0 56px}
header{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:28px}
.brand small{color:var(--accent);letter-spacing:.22em;font-weight:800;font-size:11px}.brand h1{font-size:clamp(27px,5vw,38px);margin:6px 0 0;letter-spacing:-.06em}.brand p{margin:7px 0 0;color:var(--muted);font-size:13px}
.count{border:1px solid var(--line);background:#111827aa;border-radius:14px;padding:10px 14px;text-align:right;white-space:nowrap}.count strong{display:block;font-size:20px}.count span{font-size:11px;color:var(--muted)}
.today{border:1px solid #3b514f;background:linear-gradient(120deg,#182b30,#182130 65%,#20243a);border-radius:20px;padding:20px 22px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.today .eyebrow{font-size:11px;color:var(--accent);font-weight:800;letter-spacing:.14em}.today h2{font-size:19px;margin:7px 0 4px}.today p{margin:0;color:#b9c7d3;font-size:13px}
.today button,.primary{border:0;background:var(--accent);color:#10201f;font-weight:800;border-radius:12px;padding:12px 17px;white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 14px}.filter{border:1px solid var(--line);background:#111724;border-radius:999px;padding:9px 14px;font-size:13px;color:#c4cede}.filter.active{background:#d4f2e9;color:#10201f;border-color:#d4f2e9;font-weight:800}
.card{border:1px solid var(--line);background:linear-gradient(155deg,#182131,#121824 72%);border-radius:24px;overflow:hidden;box-shadow:0 22px 70px #0005}
.cardtop{padding:26px 28px 22px;border-bottom:1px solid var(--line);background:linear-gradient(110deg,#202e3d,#192333 55%,#1b2030)}
.meta{display:flex;align-items:center;gap:9px;color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.06em}.dot{width:5px;height:5px;border-radius:50%;background:var(--gold)}
h2.title{font-size:clamp(25px,5vw,38px);line-height:1.32;letter-spacing:-.045em;margin:15px 0 8px}.subtitle{color:#aebbd0;font-size:13px}
.meaning{padding:24px 28px 22px;font-size:clamp(16px,2.5vw,19px);line-height:1.8;color:#e9f0f6}
.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 28px 26px}
.detail{background:#0f1520;border:1px solid #273246;border-radius:16px;padding:17px 18px}
.detail h3{font-size:12px;color:var(--gold);letter-spacing:.08em;margin:0 0 9px}.detail p{font-size:14px;line-height:1.75;color:#c5cfdd;margin:0}
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 28px 26px}.controlgroup{display:flex;gap:8px}.ghost{background:#1b2535;border:1px solid var(--line);border-radius:11px;padding:11px 15px;color:#dbe4ef}.ghost:disabled{opacity:.35;cursor:not-allowed}
.status{font-size:12px;color:var(--muted);text-align:center}
.empty{padding:50px 24px;text-align:center;color:var(--muted)}
footer{color:#748198;font-size:11px;text-align:center;margin-top:22px;line-height:1.7}
@media(max-width:640px){.wrap{width:min(100% - 22px,960px);padding-top:22px}.today{align-items:flex-start;flex-direction:column}.today button{width:100%}.cardtop{padding:22px 20px 18px}.meaning{padding:20px}.details{grid-template-columns:1fr;padding:0 20px 20px}.controls{padding:0 20px 20px;flex-direction:column-reverse;align-items:stretch}.controlgroup button{flex:1}.status{order:0}.count{padding:8px 10px}.count strong{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand"><small>ONE DAY · ONE KNOWLEDGE</small><h1>하루 지식</h1><p>매일 하나씩, 알아두면 좋은 이야기</p></div>
  <div class="count"><strong id="totalCount">110</strong><span>검토된 지식 항목</span></div>
</header>
<section class="today">
  <div><div class="eyebrow">TODAY'S KNOWLEDGE</div><h2 id="todayTitle">오늘의 지식을 준비하고 있어요</h2><p id="todayDate"></p></div>
  <button id="showToday">오늘의 지식 보기</button>
</section>
<nav class="filters" id="filters" aria-label="지식 분야"></nav>
<main id="content" aria-live="polite"></main>
<footer>반복 생성된 항목을 제목 기준으로 정리했습니다. 원본 자료에 포함된 설명을 바탕으로 구성했으며, 사실관계와 인용 출처는 별도 검증이 필요합니다.</footer>
</div>
<script>
const KNOWLEDGE = [{"id":"wisdom_018","category":"wisdom","categoryLabel":"문장과 지혜","title":"고진감래 (苦盡甘來)","subtitle":"쓸 고 · 다할 진 · 달 감 · 올 래","meaning":"쓴 것이 다하면 단 것이 온다는 뜻으로 고생 끝에 마침내 낙이 찾아옴을 이릅니다.","story":"오랜 인내와 노력의 시간을 견뎌낸 뒤에 오는 성취감을 뜻합니다.","example":"힘든 시험이나 프로젝트를 무사히 끝마친 날 쓰기 좋습니다.","sourceCategory":"idiom"},{"id":"wisdom_017","category":"wisdom","categoryLabel":"문장과 지혜","title":"금상첨화 (錦上添花)","subtitle":"비단 금 · 위 상 · 더할 첨 · 꽃 화","meaning":"비단 위에 꽃을 더한다는 뜻으로 좋은 일 위에 또 다른 좋은 일이 겹쳐 더욱 완벽해짐을 이릅니다.","story":"송나라 시인 왕안석의 시에서 유래한 축하의 사자성어입니다.","example":"기분 좋은 소식이 두 개 연달아 터졌을 때 감탄사로 써보세요.","sourceCategory":"idiom"},{"id":"wisdom_013","category":"wisdom","categoryLabel":"문장과 지혜","title":"대기만성 (大器晩成)","subtitle":"클 대 · 그릇 기 · 늦을 만 · 이룰 성","meaning":"큰 그릇은 만드는 데 오랜 시간이 걸리듯 크게 될 인물은 오랜 수련 끝에 늦게 이루어진다는 뜻입니다.","story":"노자 《도덕경》에 나오는 구절로 조급함을 달래주는 성어입니다.","example":"성과가 더디게 나온다고 초조해하는 친구에게 건네보세요.","sourceCategory":"idiom"},{"id":"wisdom_019","category":"wisdom","categoryLabel":"문장과 지혜","title":"우공이산 (愚公移山)","subtitle":"어리석을 우 · 공 공 · 옮길 이 · 뫼 산","meaning":"남들이 어리석다고 비웃어도 끝까지 한 가지 일을 포기하지 않고 계속하면 결국 거대한 산도 옮길 수 있다는 뜻입니다.","story":"《열자》에 나오는 우공 노인의 설화에서 유래한 끈기의 대명사입니다.","example":"꾸준함의 힘을 믿고 묵묵히 걸어갈 때 떠올리는 성어입니다.","sourceCategory":"idiom"},{"id":"wisdom_015","category":"wisdom","categoryLabel":"문장과 지혜","title":"유비무환 (有備無患)","subtitle":"있을 유 · 갖출 비 · 없을 무 · 근심 환","meaning":"미리 철저히 준비해 두면 나중에 어떤 변수가 생겨도 걱정할 것이 없다는 뜻입니다.","story":"《서경》에 나오는 말로 플랜B의 중요성을 강조합니다.","example":"백업이나 사전 점검 덕분에 위기를 넘겼을 때 딱 맞는 표현입니다.","sourceCategory":"idiom"},{"id":"wisdom_016","category":"wisdom","categoryLabel":"문장과 지혜","title":"일취월장 (日就月將)","subtitle":"날 일 · 나아갈 취 · 달 월 · 나아갈 장","meaning":"날마다 자라고 달마다 발전하여 실력이 눈에 띄게 쑥쑥 늘어남을 뜻합니다.","story":"《시경》에서 유래한 말로 꾸준한 학업과 성장을 칭찬할 때 씁니다.","example":"어제보다 오늘 더 실력이 부쩍 는 사람을 칭찬할 때 써보세요.","sourceCategory":"idiom"},{"id":"wisdom_012","category":"wisdom","categoryLabel":"문장과 지혜","title":"전화위복 (轉禍爲福)","subtitle":"구를 전 · 재앙 화 · 될 위 · 복 복","meaning":"불행이나 악재가 계기가 되어 오히려 더 큰 행운과 좋은 결과로 바뀐다는 뜻입니다.","story":"《전국책》에서 유래한 고사로 위기를 기회로 바꾸는 지혜를 뜻합니다.","example":"실수나 악재가 오히려 더 좋은 결과로 이어졌을 때 외쳐보세요.","sourceCategory":"idiom"},{"id":"wisdom_011","category":"wisdom","categoryLabel":"문장과 지혜","title":"줄탁동시 (啐啄同時)","subtitle":"쪼을 줄 · 쪼을 탁 · 한가지 동 · 때 시","meaning":"병아리가 알을 깨고 나오려면 안에서 쪼고 어미가 밖에서 동시에 쪼아야 하듯, 두 사람의 호흡과 타이밍이 완벽히 맞음을 뜻합니다.","story":"불가에서 스승과 제자의 깨달음의 순간을 비유한 데서 유래한 사자성어입니다.","example":"파트너와 환상의 호흡으로 일을 성사시켰을 때 쓰기 좋습니다.","sourceCategory":"idiom"},{"id":"wisdom_020","category":"wisdom","categoryLabel":"문장과 지혜","title":"청출어람 (靑出於藍)","subtitle":"푸를 청 · 날 출 · 어조사 어 · 쪽 람","meaning":"푸른 물감은 쪽풀에서 뽑아내지만 쪽풀보다 더 푸르듯 제자가 스승보다 더 뛰어난 실력을 갖추게 됨을 뜻합니다.","story":"《순자》 권학편에서 학문의 발전을 비유하며 나온 성어입니다.","example":"후배나 제자가 놀라운 성장을 보여줄 때 최고의 찬사가 됩니다.","sourceCategory":"idiom"},{"id":"wisdom_014","category":"wisdom","categoryLabel":"문장과 지혜","title":"파죽지세 (破竹之勢)","subtitle":"깨뜨릴 파 · 대 죽 · 갈 지 · 기세 세","meaning":"대나무를 쪼갤 때 첫 몇 마디만 쪼개면 나머지는 저절로 갈라지듯 거침없이 몰아붙이는 기세를 뜻합니다.","story":"진나라 장수 두예가 오나라를 정벌할 때의 기세를 비유한 말입니다.","example":"연승을 달리거나 작업 속도가 폭발적으로 붙었을 때 씁니다.","sourceCategory":"idiom"},{"id":"wisdom_065","category":"wisdom","categoryLabel":"문장과 지혜","title":"나는 생각한다, 고로 존재한다 (Cogito, ergo sum)","subtitle":"르네 데카르트","meaning":"세상의 모든 것을 거짓이라고 의심해 보아도, 지금 그렇게 의심하고 생각하는 나 자신의 존재만큼은 부정할 수 없다는 뜻입니다.","story":"근대 철학의 아버지 데카르트가 방법적 회의를 통해 도달한 제1원리입니다.","example":"흔들리지 않는 자기 확신의 출발점을 이야기할 때 인용됩니다.","sourceCategory":"philosophy"},{"id":"wisdom_062","category":"wisdom","categoryLabel":"문장과 지혜","title":"너 자신을 알라 (Gnothi Seauton)","subtitle":"소크라테스","meaning":"내가 무엇을 알고 무엇을 모르는지 스스로의 한계를 자각하는 메타인지가 지혜의 출발점이라는 뜻입니다.","story":"고대 그리스 델포이 신전의 글귀이자 소크라테스 산파술의 핵심 모토입니다.","example":"객관적인 자기 점검이 필요한 순간에 떠올리는 명제입니다.","sourceCategory":"philosophy"},{"id":"wisdom_070","category":"wisdom","categoryLabel":"문장과 지혜","title":"무지의 지 (無知之知)","subtitle":"소크라테스","meaning":"자신이 모른다는 사실을 정확히 아는 것이야말로 가장 뛰어난 앎이라는 역설적 지혜입니다.","story":"안다고 자만하는 사람은 더 이상 배우지 않지만 모름을 인정하는 사람은 열린 마음으로 성장합니다.","example":"새로운 분야를 배울 때 겸손한 탐구 자세를 강조하는 말입니다.","sourceCategory":"philosophy"},{"id":"wisdom_063","category":"wisdom","categoryLabel":"문장과 지혜","title":"실존은 본질에 앞선다","subtitle":"장폴 사르트르","meaning":"인간은 정해진 운명(본질)대로 사는 존재가 아니라 매 순간의 주체적 선택(실존)으로 스스로를 만들어간다는 뜻입니다.","story":"프랑스 실존주의 철학의 가장 핵심이 되는 선언문입니다.","example":"환경 탓을 멈추고 내 선택의 힘을 믿고 싶을 때 큰 울림을 줍니다.","sourceCategory":"philosophy"},{"id":"wisdom_061","category":"wisdom","categoryLabel":"문장과 지혜","title":"아모르 파티 (Amor Fati — 네 운명을 사랑하라)","subtitle":"프리드리히 니체","meaning":"내 삶에 찾아오는 기쁨뿐 아니라 시련까지도 내 인생의 필연적 재료로 긍정하고 사랑하라는 철학입니다.","story":"독일 철학자 니체가 수동적 체념이 아닌 능동적 삶의 개척을 강조하며 제시한 개념입니다.","example":"예상치 못한 난관을 내 성장의 스토리로 바꿀 때 인용하세요.","sourceCategory":"philosophy"},{"id":"wisdom_064","category":"wisdom","categoryLabel":"문장과 지혜","title":"오컴의 면도날 (Occam’s Razor)","subtitle":"윌리엄 오컴","meaning":"어떤 현상을 설명할 때 불필요하게 복잡한 억측들을 면도날로 쳐내고 가장 단순 명쾌한 설명을 택하라는 원리입니다.","story":"14세기 철학자 오컴이 제시한 경제성의 원리로 현대 과학적 사고의 기초가 되었습니다.","example":"지나친 망상이나 걱정 회로를 끊어낼 때 아주 유용한 개념입니다.","sourceCategory":"philosophy"},{"id":"wisdom_066","category":"wisdom","categoryLabel":"문장과 지혜","title":"인간은 생각하는 갈대다","subtitle":"블레즈 파스칼 《팡세》","meaning":"인간은 자연 속에서 갈대처럼 연약한 존재이지만, 우주를 품어 생각하는 사유의 힘을 가졌기에 위대하다는 뜻입니다.","story":"수학자이자 철학자인 파스칼이 인간의 유한성과 존엄성을 동시에 표현한 구절입니다.","example":"사색과 지성의 힘을 강조할 때 자주 쓰입니다.","sourceCategory":"philosophy"},{"id":"wisdom_067","category":"wisdom","categoryLabel":"문장과 지혜","title":"정반합 (正反合 — 변증법적 발전)","subtitle":"게오르크 헤겔","meaning":"하나의 주장(정)과 반대되는 의견(반)이 부딪히며 더 높은 차원의 통합된 해답(합)으로 발전해 나간다는 원리입니다.","story":"헤겔 철학의 핵심 모델로 갈등과 토론이 성장을 만든다는 이치를 설명합니다.","example":"서로 다른 의견이 충돌할 때 더 좋은 제3의 대안을 찾자고 할 때 씁니다.","sourceCategory":"philosophy"},{"id":"wisdom_068","category":"wisdom","categoryLabel":"문장과 지혜","title":"중용 (中庸 — 과유불급을 피하는 조화)","subtitle":"공자 · 아리스토텔레스","meaning":"양극단의 치우침(너무 넘치거나 모자람)을 피하고 상황에 가장 적절하고 조화로운 중심을 잡는 덕목입니다.","story":"동양의 공자와 서양의 아리스토텔레스가 공통으로 꼽은 최고의 실천적 지혜입니다.","example":"일과 휴식, 열정과 냉정의 밸런스를 맞출 때 핵심 기준이 됩니다.","sourceCategory":"philosophy"},{"id":"wisdom_069","category":"wisdom","categoryLabel":"문장과 지혜","title":"타인은 지옥이다","subtitle":"장폴 사르트르 《닫힌 방》","meaning":"남들의 시선과 평가에 내 삶의 기준을 넘겨주는 순간 내 주체성을 잃고 지옥 같은 괴로움에 빠진다는 뜻입니다.","story":"타인과의 관계 자체를 부정하는 것이 아니라 남의 눈치에 갇히지 말라는 실존적 경고입니다.","example":"SNS 비교 피로감에서 벗어나 나답게 살고자 할 때 인용합니다.","sourceCategory":"philosophy"},{"id":"wisdom_076","category":"wisdom","categoryLabel":"문장과 지혜","title":"가는 말이 고와야 오는 말이 곱다","subtitle":"우리 전래 속담","meaning":"내가 먼저 상대방에게 예의 바르고 다정하게 말해야 상대도 나에게 좋게 대한다는 뜻입니다.","story":"인간관계 소통의 가장 기본이 되는 상호 존중의 법칙입니다.","example":"온라인 채팅이나 일상 대화 예절을 이야기할 때 빠지지 않습니다.","sourceCategory":"proverb"},{"id":"wisdom_071","category":"wisdom","categoryLabel":"문장과 지혜","title":"가랑비에 옷 젖는 줄 모른다","subtitle":"우리 전래 속담","meaning":"아무리 작고 사소해 보이는 일이라도 계속 쌓이면 나중에 큰 결과를 만든다는 뜻입니다.","story":"이슬비에 옷이 젖듯 작은 지출이나 작은 습관의 누적을 비유합니다.","example":"소액 결제를 아끼거나 매일 10분 공부를 강조할 때 씁니다.","sourceCategory":"proverb"},{"id":"wisdom_072","category":"wisdom","categoryLabel":"문장과 지혜","title":"구슬이 서 말이라도 꿰어야 보배다","subtitle":"우리 전래 속담","meaning":"아무리 좋은 재료나 재능이 많아도 실제로 다듬어 완성하지 않으면 아무 쓸모가 없다는 뜻입니다.","story":"고려가요 정석가에도 등장하는 실행력 강조 속담입니다.","example":"아이디어만 많고 실행을 미루는 순간에 일침으로 쓰입니다.","sourceCategory":"proverb"},{"id":"wisdom_077","category":"wisdom","categoryLabel":"문장과 지혜","title":"급히 먹는 밥이 체한다","subtitle":"우리 전래 속담","meaning":"마음만 급해서 순서나 기본을 건너뛰고 서두르면 오히려 일을 그르친다는 뜻입니다.","story":"조급증이 실수를 부를 때 한 템포 쉬어가라는 조언으로 씁니다.","example":"계약이나 중요한 결정을 앞두고 차분히 검토할 때 인용하세요.","sourceCategory":"proverb"},{"id":"wisdom_078","category":"wisdom","categoryLabel":"문장과 지혜","title":"돌다리도 두드려 보고 건너라","subtitle":"우리 전래 속담","meaning":"아무리 잘 알고 확실해 보이는 일이라도 한 번 더 꼼꼼하게 점검하고 진행하라는 뜻입니다.","story":"튼튼해 보이는 돌다리도 물살에 밑이 패었을 수 있다는 신중함의 지혜입니다.","example":"최종 배포나 송출 전 테스트를 다시 확인할 때 딱 맞습니다.","sourceCategory":"proverb"},{"id":"wisdom_080","category":"wisdom","categoryLabel":"문장과 지혜","title":"백지장도 맞들면 낫다","subtitle":"우리 전래 속담","meaning":"아무리 가볍고 쉬운 일이라도 혼자 끙끙대는 것보다 둘이 힘을 합치면 훨씬 수월하다는 뜻입니다.","story":"협업과 분담의 중요성을 가벼운 종이 한 장에 비유한 속담입니다.","example":"동료나 시청자에게 함께 아이디어를 모아보자고 할 때 좋습니다.","sourceCategory":"proverb"},{"id":"wisdom_075","category":"wisdom","categoryLabel":"문장과 지혜","title":"벼는 익을수록 고개를 숙인다","subtitle":"우리 전래 속담","meaning":"실력과 인격이 훌륭하고 가진 것이 많은 사람일수록 잘난 체하지 않고 겸손하다는 뜻입니다.","story":"가을 들판의 잘 여문 벼 이삭이 무게로 인해 자연히 숙여지는 모습을 비유했습니다.","example":"성공한 뒤에도 초심과 겸손을 지키는 사람을 칭찬할 때 씁니다.","sourceCategory":"proverb"},{"id":"wisdom_073","category":"wisdom","categoryLabel":"문장과 지혜","title":"우물을 파도 한 우물을 파라","subtitle":"우리 전래 속담","meaning":"이 일 저 일 벌이기보다 한 분야에 끝까지 집중해야 진짜 성과를 본다는 뜻입니다.","story":"물줄기가 나올 때까지 한 곳을 깊게 파야 물을 얻는 이치입니다.","example":"장인정신과 몰입의 가치를 이야기할 때 자주 인용됩니다.","sourceCategory":"proverb"},{"id":"wisdom_074","category":"wisdom","categoryLabel":"문장과 지혜","title":"천 리 길도 한 걸음부터","subtitle":"우리 전래 속담","meaning":"아무리 거창하고 먼 목표라도 결국 지금 내딛는 작은 첫걸음에서 시작된다는 뜻입니다.","story":"노자 도덕경의 천리지행 시어족하와도 맥을 같이합니다.","example":"거대한 프로젝트 앞에서 막막함을 느낄 때 힘을 줍니다.","sourceCategory":"proverb"},{"id":"wisdom_079","category":"wisdom","categoryLabel":"문장과 지혜","title":"티끌 모아 태산","subtitle":"우리 전래 속담","meaning":"아주 작은 먼지라도 오랫동안 차곡차곡 모으면 큰 산처럼 거대한 분량이 된다는 뜻입니다.","story":"저축과 일상의 작은 루틴이 가진 복리의 마법을 잘 보여줍니다.","example":"매일 조금씩 쌓아가는 포트폴리오의 가치를 말할 때 씁니다.","sourceCategory":"proverb"},{"id":"wisdom_084","category":"wisdom","categoryLabel":"문장과 지혜","title":"가장 어두운 밤도 결국 끝나고 태양은 다시 떠오른다.","subtitle":"빅토르 위고 《레 미제라블》","meaning":"아무리 길고 고통스러운 시련도 반드시 지나가고 새로운 희망의 아침이 온다는 뜻입니다.","story":"대문호 빅토르 위고가 절망 속의 인물들을 위로하며 남긴 불멸의 문장입니다.","example":"슬럼프를 겪는 동료나 시청자에게 따뜻한 응원으로 건네보세요.","sourceCategory":"quote"},{"id":"wisdom_090","category":"wisdom","categoryLabel":"문장과 지혜","title":"기회는 준비된 자에게만 미소 짓는다.","subtitle":"루이 파스퇴르","meaning":"우연한 행운처럼 보이는 발견도 평소에 치열하게 준비하고 연구한 사람만이 알아보고 잡을 수 있다는 뜻입니다.","story":"백신과 저온살균법을 발명한 과학자 파스퇴르의 유명한 강연 구절입니다.","example":"평소 실력을 차곡차곡 쌓아야 하는 이유로 인용하기 좋습니다.","sourceCategory":"quote"},{"id":"wisdom_087","category":"wisdom","categoryLabel":"문장과 지혜","title":"넘어지지 않는 것이 영광이 아니라 넘어질 때마다 일어서는 것이 진짜 영광이다.","subtitle":"넬슨 만델라","meaning":"실패 없는 삶보다 실패를 겪고도 다시 털고 일어나는 회복탄력성이 더 위대하다는 뜻입니다.","story":"27년간의 감옥 생활을 견디고 남아공 최초의 흑인 대통령이 된 만델라의 삶이 담긴 말입니다.","example":"실수한 뒤 자책하는 사람에게 용기를 주는 문장입니다.","sourceCategory":"quote"},{"id":"wisdom_083","category":"wisdom","categoryLabel":"문장과 지혜","title":"생각하는 대로 살지 않으면 사는 대로 생각하게 된다.","subtitle":"폴 부르제 《정오의 악마》","meaning":"주체적인 목표 없이 살면 눈앞의 환경과 타성에 끌려다니며 자기합리화를 하게 된다는 뜻입니다.","story":"프랑스 작가 폴 부르제가 1914년 소설에서 남긴 구절로 삶의 주도권을 일깨웁니다.","example":"하루 루틴과 목표를 점검할 때 쓰기 좋은 명언입니다.","sourceCategory":"quote"},{"id":"wisdom_088","category":"wisdom","categoryLabel":"문장과 지혜","title":"시간은 인간이 쓸 수 있는 가장 값진 것이다.","subtitle":"테오프라스토스","meaning":"돈이나 물건은 다시 얻을 수 있지만 흘러간 시간은 절대 되돌릴 수 없다는 뜻입니다.","story":"고대 그리스 철학자 테오프라스토스가 시간 관리의 가치를 설파한 말입니다.","example":"하루 1시간의 집중 시간을 지킬 때 떠올려 보세요.","sourceCategory":"quote"},{"id":"wisdom_086","category":"wisdom","categoryLabel":"문장과 지혜","title":"시작이 반이다.","subtitle":"아리스토텔레스","meaning":"무슨 일이든 첫걸음을 떼어 착수하는 순간 이미 절반은 이룬 것과 같다는 뜻입니다.","story":"고대 그리스 철학자 아리스토텔레스가 실천의 중요성을 강조하며 남긴 격언입니다.","example":"미루던 과제를 딱 5분만이라도 시작해 보자고 권할 때 좋습니다.","sourceCategory":"quote"},{"id":"wisdom_082","category":"wisdom","categoryLabel":"문장과 지혜","title":"완벽함이 아니라 완성이 목표가 되어야 한다.","subtitle":"셰릴 샌드버그 (Done is better than perfect)","meaning":"100점짜리를 만들려다 시작도 못 하는 것보다 80점이라도 끝까지 완성하는 것이 훨씬 가치 있다는 뜻입니다.","story":"실리콘밸리 초기 메타 사옥에 붙어 있던 슬로건으로 완벽주의에 빠진 현대인에게 실행력을 불어넣습니다.","example":"오늘 일단 초안이라도 끝내자고 다독일 때 최고의 한마디가 됩니다.","sourceCategory":"quote"},{"id":"wisdom_081","category":"wisdom","categoryLabel":"문장과 지혜","title":"우리가 두려워해야 할 유일한 것은 두려움 그 자체이다.","subtitle":"프랭클린 D. 루스벨트","meaning":"막연한 공포에 사로잡혀 행동을 멈추는 것이 실제 위기보다 더 위험하다는 뜻입니다.","story":"1933년 세계 대공황 당시 루스벨트 대통령의 취임 연설 첫마디로, 국민적 패닉을 잠재운 역사적 명언입니다.","example":"새로운 도전 앞에서 시작도 하기 전에 겁이 날 때 스스로를 다잡는 문장으로 활용하세요.","sourceCategory":"quote"},{"id":"wisdom_085","category":"wisdom","categoryLabel":"문장과 지혜","title":"천재는 1%의 영감과 99%의 땀으로 이루어진다.","subtitle":"토머스 에디슨","meaning":"아무리 뛰어난 아이디어도 끝까지 구현해 내는 끈질긴 노력 없이는 결실을 맺을 수 없다는 뜻입니다.","story":"수천 번의 필라멘트 실험 끝에 전구를 발명한 에디슨의 실험 정신을 상징합니다.","example":"꾸준한 반복 연습의 중요성을 강조할 때 인용해 보세요.","sourceCategory":"quote"},{"id":"wisdom_089","category":"wisdom","categoryLabel":"문장과 지혜","title":"행복은 습관이다. 그것을 몸에 지녀라.","subtitle":"엘버트 허버드","meaning":"행복은 거창한 조건이 아니라 매일의 작은 긍정과 감사를 반복하는 습관에서 온다는 뜻입니다.","story":"미국의 작가 엘버트 허버드가 일상의 태도를 강조하며 남긴 격언입니다.","example":"아침 기상 직후 기분 좋은 다짐으로 하루를 열 때 써보세요.","sourceCategory":"quote"},{"id":"history_009","category":"history","categoryLabel":"역사","title":"귀주대첩 (1019년 고려 강감찬)","subtitle":"거란 3차 침입 소배압의 10만 대군 격파","meaning":"72세의 노장 강감찬이 흥화진 수공과 귀주 벌판의 포위 섬멸전으로 거란군을 완전히 물리친 대승입니다.","story":"이 전투 이후 고려·송·거란 사이에 약 100년간 동아시아 평화 균형 시대가 열렸습니다.","example":"노련한 준비와 결단력이 만든 승리로 기억됩니다.","sourceCategory":"history"},{"id":"history_005","category":"history","categoryLabel":"역사","title":"대동법 시행 (1608년 ~ 1708년)","subtitle":"광해군 원년 경기도 첫 시행 · 백성 세금 개혁","meaning":"집집마다 특산물로 내던 가혹한 공납을 가진 땅 넓이(결수)에 따라 쌀·옷감·동전으로 내게 바꾼 민생 개혁법입니다.","story":"지주들의 반발을 뚫고 100년에 걸쳐 전국화되며 조선 후기 상품 화폐 경제를 꽃피웠습니다.","example":"합리적인 시스템 개혁이 세상을 바꾸는 과정을 보여줍니다.","sourceCategory":"history"},{"id":"history_010","category":"history","categoryLabel":"역사","title":"동의보감 완성 (1610년 허준)","subtitle":"선조 명으로 착수 · 광해군 2년 완성","meaning":"백성들이 주변에서 쉽게 구할 수 있는 약재(향약)와 치료법을 집대성한 동양 의학의 백과사전입니다.","story":"2009년 의학 서적으로는 세계 최초로 유네스코 세계기록유산에 등재되었습니다.","example":"실용성과 백성을 향한 따뜻한 인술을 상징합니다.","sourceCategory":"history"},{"id":"history_006","category":"history","categoryLabel":"역사","title":"살수대첩 (612년 고구려 을지문덕)","subtitle":"수나라 113만 대군 격퇴","meaning":"을지문덕 장군이 청야전술과 유인책으로 지친 수나라 우중문 부대를 살수(청천강)에서 궤멸시킨 대승입니다.","story":"유명한 여수장우중문시(오언고시)로 적장을 조롱하며 퇴각을 유도한 뒤 결정타를 날렸습니다.","example":"적의 약점을 파고드는 치밀한 전략 승리의 대명사입니다.","sourceCategory":"history"},{"id":"history_003","category":"history","categoryLabel":"역사","title":"서희의 강동 6주 외교 담판 (993년)","subtitle":"고려 성종 12년 거란 1차 침입","meaning":"상대방의 진짜 의도를 정확히 꿰뚫어 본 외교 협상만으로 피 한 방울 흘리지 않고 압록강 동쪽 영토를 넓힌 사건입니다.","story":"거란이 영토 할양이 아니라 송과의 단교를 원한다는 핵심을 간파해 일궈낸 외교사의 걸작입니다.","example":"싸우지 않고 이기는 지략과 협상력을 비유할 때 첫손에 꼽힙니다.","sourceCategory":"history"},{"id":"history_001","category":"history","categoryLabel":"역사","title":"신에게는 아직 12척의 배가 남아 있사옵니다","subtitle":"1597년 명량해전 직전 — 충무공 이순신","meaning":"절체절명의 위기 속에서도 남은 자원을 모아 끝까지 싸워 이기겠다는 불굴의 결의를 담은 장계입니다.","story":"칠천량 해전 패배 후 수군 폐지령이 내려진 상황에서 선조에게 올린 역사적 문장입니다.","example":"포기하지 않는 역전 드라마를 이야기할 때 가장 뜨거운 울림을 줍니다.","sourceCategory":"history"},{"id":"history_004","category":"history","categoryLabel":"역사","title":"직지심체요절 (1377년 청주 흥덕사)","subtitle":"현존 세계 최고(最古)의 금속활자본","meaning":"독일 구텐베르크 성서보다 78년 앞서 인쇄된 세계에서 가장 오래된 금속활자 인쇄물입니다.","story":"고려의 정교한 금속 주조 기술과 출판 문화를 증명하며 유네스코 세계기록유산에 등재되었습니다.","example":"한국 전통 과학기술의 우수성을 보여주는 대표 사례입니다.","sourceCategory":"history"},{"id":"history_008","category":"history","categoryLabel":"역사","title":"측우기 발명 (1441년 세계 최초의 표준 우량계)","subtitle":"세종 23년 · 문종(당시 세자)과 장영실 등","meaning":"서양(이탈리아 카스텔리, 1639년)보다 약 200년 앞서 전국 단위로 강우량을 정밀 측정한 기상 관측 기구입니다.","story":"농업 국가에서 가뭄과 홍수를 과학적 수치로 기록해 세금 감면과 농정 기초 자료로 활용했습니다.","example":"데이터 기반 과학 행정의 역사적 모범 사례입니다.","sourceCategory":"history"},{"id":"history_007","category":"history","categoryLabel":"역사","title":"팔만대장경 (재조대장경 · 합천 해인사)","subtitle":"고려 고종 (몽골 침입기 16년간 판각)","meaning":"몽골의 침입을 부처의 힘으로 이겨내고자 경판 8만 1,258장에 오탈자 없이 새겨낸 세계 문화유산입니다.","story":"자작나무 등을 바닷물에 절이고 옻칠해 770년이 지난 지금도 뒤틀림 없이 완벽하게 보존되어 있습니다.","example":"장인정신과 국난 극복 의지의 결정체로 꼽힙니다.","sourceCategory":"history"},{"id":"history_002","category":"history","categoryLabel":"역사","title":"훈민정음 창제와 반포 (1443년 · 1446년)","subtitle":"세종대왕 (조선 제4대 국왕)","meaning":"글자를 몰라 억울함을 겪는 백성들이 누구나 쉽게 배우고 뜻을 펼치도록 세종대왕이 창제한 과학적 문자입니다.","story":"만든 사람, 반포 시기, 제자 원리(해례본)가 모두 전해지는 세계 유일의 유네스코 기록유산 문자입니다.","example":"우리 말과 글의 독창성과 애민 정신을 되새길 때 핵심이 됩니다.","sourceCategory":"history"},{"id":"science_096","category":"science","categoryLabel":"과학","title":"관성의 법칙 (뉴턴의 운동 제1법칙)","subtitle":"아이작 뉴턴 《프린키피아》","meaning":"외부에서 힘이 가해지지 않으면 정지해 있는 물체는 계속 정지해 있으려 하고, 움직이는 물체는 계속 같은 속도로 움직이려 하는 성질입니다.","story":"버스가 급출발할 때 몸이 뒤로 쏠리는 현상이 대표적인 관성입니다.","example":"공부나 운동도 처음 시작할 때 가장 힘이 들고 일단 탄력이 붙으면 계속하기 쉬워지는 원리와 같습니다.","sourceCategory":"science"},{"id":"science_094","category":"science","categoryLabel":"과학","title":"나비 효과 (초기 조건의 민감성)","subtitle":"에드워드 로렌츠 (1972년 카오스 이론)","meaning":"브라질 나비의 작은 날갯짓이 대기를 타고 증폭되어 미국 텍사스에 토네이도를 일으킬 수 있다는 이론입니다.","story":"기상 시뮬레이션에서 소수점 아래 미세한 반올림 차이가 결과를 완전히 바꾼 데서 발견되었습니다.","example":"사소한 습관이나 선택 하나가 인생 전체를 바꾸는 현상을 뜻합니다.","sourceCategory":"science"},{"id":"science_100","category":"science","categoryLabel":"과학","title":"도파민 보상 회로 (기대와 성취의 신경전달물질)","subtitle":"뇌과학 · 신경생물학","meaning":"도파민은 결과를 얻었을 때보다 보상을 기대하고 목표를 향해 다가가는 과정에서 가장 강력하게 분비되는 호르몬입니다.","story":"큰 목표를 작게 쪼개어 매일 체크리스트를 지워나갈 때 뇌의 도파민 회로가 건강하게 활성화됩니다.","example":"꾸준한 동기부여 시스템을 설계할 때 필수적인 뇌과학 지식입니다.","sourceCategory":"science"},{"id":"science_093","category":"science","categoryLabel":"과학","title":"도플러 효과 (파동의 진동수 변화)","subtitle":"크리스티안 도플러 (1842년)","meaning":"소리를 내는 물체가 다가올 때는 음이 높게 들리고 멀어질 때는 낮게 들리는 현상입니다.","story":"구급차 사이렌 소리 변화부터 우주 팽창(적색편이) 관측, 야구 스피드건까지 폭넓게 응용됩니다.","example":"일상 속 물리학이 첨단 천문학으로 이어지는 대표 사례입니다.","sourceCategory":"science"},{"id":"science_099","category":"science","categoryLabel":"과학","title":"베르누이의 정리 (유체 속도와 압력의 관계)","subtitle":"다니엘 베르누이 (1738년)","meaning":"공기나 물 같은 유체의 흐름이 빨라지면 그 지점의 압력은 낮아지고, 느려지면 압력이 높아진다는 유체역학 원리입니다.","story":"비행기 날개 위아래의 공기 속도 차이로 양력이 발생하고 야구공의 변화구가 휘어지는 원리입니다.","example":"스포츠와 항공 과학을 이해하는 핵심 열쇠입니다.","sourceCategory":"science"},{"id":"science_091","category":"science","categoryLabel":"과학","title":"슈뢰딩거의 고양이 (양자 중첩 상태)","subtitle":"에르빈 슈뢰딩거 (1935년)","meaning":"상자를 열어 관측하기 전까지는 고양이가 살아 있는 상태와 죽은 상태가 동시에 겹쳐 존재한다는 양자역학 사고실험입니다.","story":"미시 세계의 확률적 중첩이 거시 세계와 어떻게 연결되는지 묻기 위해 고안되었습니다.","example":"결과 발표를 열어보기 전 두근거리는 반반의 상황을 비유할 때 씁니다.","sourceCategory":"science"},{"id":"science_092","category":"science","categoryLabel":"과학","title":"엔트로피 법칙 (열역학 제2법칙)","subtitle":"클라우지우스 · 볼츠만","meaning":"고립된 시스템에서 에너지는 항상 질서 있는 상태에서 무질서한 상태(엔트로피 증가)로 흐른다는 물리 법칙입니다.","story":"시간의 화살이 왜 한쪽 방향으로만 흐르는지 설명하는 우주 대원칙입니다.","example":"방이나 책상을 가만히 두면 저절로 어질러지는 이유를 유머러스하게 설명할 때 씁니다.","sourceCategory":"science"},{"id":"science_097","category":"science","categoryLabel":"과학","title":"작용 반작용의 법칙 (뉴턴의 운동 제3법칙)","subtitle":"아이작 뉴턴","meaning":"물체 A가 물체 B에 힘을 가하면(작용), 물체 B도 물체 A에 크기가 같고 방향이 반대인 힘을 동시에 가한다(반작용)는 법칙입니다.","story":"로켓이 가스를 아래로 내뿜는 힘으로 우주를 향해 위로 솟구치는 원리입니다.","example":"인간관계에서도 내가 주는 만큼 되돌아온다는 비유로 자주 쓰입니다.","sourceCategory":"science"},{"id":"science_095","category":"science","categoryLabel":"과학","title":"플라시보 효과 (위약 효과 — 믿음의 힘)","subtitle":"현대의학 · 신경심리학","meaning":"약효가 없는 가짜 약이라도 효과가 있다고 굳게 믿고 복용하면 뇌에서 엔도르핀 등이 분비되어 실제로 증상이 호전되는 현상입니다.","story":"신약 개발 시 진짜 약효를 검증하기 위해 반드시 플라시보 대조군 실험을 거칩니다.","example":"긍정적인 마인드셋이 신체에 미치는 실제 과학적 영향을 보여줍니다.","sourceCategory":"science"},{"id":"science_098","category":"science","categoryLabel":"과학","title":"항상성 (Homeostasis — 생체 균형 유지)","subtitle":"월터 캐넌 (생리학)","meaning":"외부 환경이 변하더라도 체온(36.5도), 혈당, 수분량 등 우리 몸 내부 상태를 일정하게 유지하려는 자율 조절 능력입니다.","story":"추우면 몸을 떨어 열을 내고 더우면 땀을 흘려 열을 식히는 정교한 생명 시스템입니다.","example":"멘탈 관리에서도 흔들린 뒤 다시 평정심을 찾는 힘으로 비유됩니다.","sourceCategory":"science"},{"id":"culture_025","category":"culture","categoryLabel":"언어와 문화","title":"가온누리","subtitle":"순우리말 결합어","meaning":"가온(가운데·중심)과 누리(세상)가 합쳐져 무슨 일이든 세상의 중심이 되어라라는 뜻을 담고 있습니다.","story":"누군가의 새로운 출발이나 생일을 축하하며 건네기 좋은 순우리말입니다.","example":"자존감과 주인공 의식을 북돋아 줄 때 멋진 단어가 됩니다.","sourceCategory":"korean"},{"id":"culture_029","category":"culture","categoryLabel":"언어와 문화","title":"길가온","subtitle":"순우리말 명사","meaning":"길의 한가운데, 또는 내가 걸어가는 인생길의 중심을 뜻하는 순우리말입니다.","story":"흔들리지 않고 나만의 길을 걸어간다는 의미를 담기에 좋은 단어입니다.","example":"진로나 목표를 향해 나아가는 시기에 어울리는 말입니다.","sourceCategory":"korean"},{"id":"culture_027","category":"culture","categoryLabel":"언어와 문화","title":"꽃잠","subtitle":"순우리말 명사","meaning":"아주 깊이 잘 자는 달콤하고 평온한 잠을 뜻하는 순우리말입니다.","story":"하루 일과를 마치고 시청자나 지인에게 건네는 밤 인사로 더없이 다정한 표현입니다.","example":"오늘 밤도 걱정 내려놓고 꽃잠 주무세요!라고 인사해 보세요.","sourceCategory":"korean"},{"id":"culture_030","category":"culture","categoryLabel":"언어와 문화","title":"나래 & 미리내","subtitle":"순우리말 명사","meaning":"나래는 날개를 뜻하고, 미리내는 밤하늘의 은하수를 뜻하는 아름다운 순우리말입니다.","story":"상상의 나래를 펴다처럼 꿈과 우주를 우리말로 표현할 때 가장 빛나는 단어들입니다.","example":"창작 활동이나 밤하늘 감성을 이야기할 때 활용해 보세요.","sourceCategory":"korean"},{"id":"culture_024","category":"culture","categoryLabel":"언어와 문화","title":"다소니","subtitle":"순우리말 명사","meaning":"사랑하는 사람을 뜻하는 따뜻하고 다정한 순우리말 옛말입니다.","story":"연인이나 배우자, 혹은 평생 아끼는 소중한 사람을 부르는 애칭으로 인기가 높습니다.","example":"소중한 사람에게 특별한 호칭을 붙여줄 때 활용해 보세요.","sourceCategory":"korean"},{"id":"culture_023","category":"culture","categoryLabel":"언어와 문화","title":"도담도담","subtitle":"순우리말 부사","meaning":"어린아이가 탈 없이 건강하고 씩씩하게 잘 자라는 모양을 뜻하는 순우리말입니다.","story":"어감이 따뜻하고 예뻐서 성장하는 채널이나 모임을 응원할 때도 널리 쓰입니다.","example":"새롭게 시작하는 프로젝트의 성장을 기원할 때 써보세요.","sourceCategory":"korean"},{"id":"culture_022","category":"culture","categoryLabel":"언어와 문화","title":"시나브로","subtitle":"순우리말 부사","meaning":"모르는 사이에 조금씩 조금씩이라는 뜻의 순우리말입니다.","story":"매일 조금씩 쌓인 노력이 어느새 큰 실력으로 자라나 있을 때 쓰기 좋은 시적인 단어입니다.","example":"꾸준한 연습과 성장의 과정을 표현할 때 아주 잘 어울립니다.","sourceCategory":"korean"},{"id":"culture_028","category":"culture","categoryLabel":"언어와 문화","title":"아띠","subtitle":"순우리말 명사","meaning":"오래도록 변함없이 가깝게 지내는 친한 친구를 뜻하는 순우리말입니다.","story":"짧고 부르기 쉬워 친구 모임이나 반려동물, 팬 애칭으로도 자주 쓰입니다.","example":"오랜 우정을 이야기할 때 소개하기 좋은 우리말입니다.","sourceCategory":"korean"},{"id":"culture_026","category":"culture","categoryLabel":"언어와 문화","title":"여우비","subtitle":"순우리말 명사","meaning":"햇볕이 환하게 나 있는 맑은 날에 잠깐 내리다 그치는 비를 뜻합니다.","story":"여우가 시집가는 날 내리는 비라는 옛 설화에서 유래한 정감 어린 우리말입니다.","example":"변덕스럽지만 반가운 날씨를 표현할 때 써보세요.","sourceCategory":"korean"},{"id":"culture_021","category":"culture","categoryLabel":"언어와 문화","title":"윤슬","subtitle":"순우리말 명사","meaning":"햇빛이나 달빛에 비치어 반짝이는 잔물결을 뜻하는 아름다운 순우리말입니다.","story":"강물이나 바다 위로 햇살이 쏟아질 때 보석처럼 반짝이는 풍경을 두 글자로 담아냈습니다.","example":"산책길이나 감성적인 풍경을 묘사할 때 쓰기 좋습니다.","sourceCategory":"korean"},{"id":"culture_056","category":"culture","categoryLabel":"언어와 문화","title":"계획이 다 있구나","subtitle":"영화 《기생충》 송강호 명대사 밈","meaning":"상대방이 무언가 치밀하게 준비해 두었거나, 반대로 아무 대책 없어 보일 때 유머러스하게 건네는 대사입니다.","story":"아카데미 4관왕 영화 기생충의 가장 유명한 유행어로 일상 대화에 완벽히 스며들었습니다.","example":"친구나 시청자의 기발한 아이디어를 들었을 때 리액션으로 좋습니다.","sourceCategory":"meme"},{"id":"culture_058","category":"culture","categoryLabel":"언어와 문화","title":"나 때는 말이야 (라떼는 말이야)","subtitle":"세대 공감 유머 밈","meaning":"과거의 경험을 이야기할 때 꼰대처럼 들리지 않도록 스스로 유머러스하게 쿠션을 깔고 시작하는 표현입니다.","story":"라떼(Latte) 커피와 발음이 비슷한 것을 이용한 재치 있는 언어유희입니다.","example":"예전 추억이나 게임 이야기를 꺼낼 때 가볍게 운을 떼기 좋습니다.","sourceCategory":"meme"},{"id":"culture_057","category":"culture","categoryLabel":"언어와 문화","title":"묻고 더블로 가!","subtitle":"영화 《타짜》 곽철용 명대사 밈","meaning":"좋은 흐름이 왔을 때 망설이지 않고 판을 두 배로 키우거나 과감하게 직진할 때 외치는 유행어입니다.","story":"영화 개봉 후 10년 뒤 역주행하며 광고와 방송계를 휩쓴 전설적인 밈입니다.","example":"텐션이 올랐을 때 다음 코너로 시원하게 달리며 외쳐보세요.","sourceCategory":"meme"},{"id":"culture_054","category":"culture","categoryLabel":"언어와 문화","title":"아무튼 ~했죠? / 한 잔 해","subtitle":"쿨한 결과주의 밈","meaning":"과정이 조금 엉성했더라도 결과적으로 목표만 달성했으면 복잡하게 따지지 말고 기분 좋게 넘어가자는 유머 화법입니다.","story":"특유의 능청스럽고 유쾌한 뉘앙스로 사소한 실수를 웃음으로 승화시킵니다.","example":"우여곡절 끝에 미션을 클리어했을 때 쓰기 좋습니다.","sourceCategory":"meme"},{"id":"culture_060","category":"culture","categoryLabel":"언어와 문화","title":"알잘딱깔센","subtitle":"알아서 잘 딱 깔끔하고 센스 있게","meaning":"구구절절 설명하지 않아도 상황 파악을 빠르게 해서 군더더기 없이 일 처리를 완벽히 해내는 모습을 뜻합니다.","story":"인터넷 방송에서 탄생해 이제는 직장 생활과 일상에서도 표준어처럼 쓰이는 만능 표현입니다.","example":"센스 넘치는 도움을 받았을 때 칭찬으로 건네보세요.","sourceCategory":"meme"},{"id":"culture_052","category":"culture","categoryLabel":"언어와 문화","title":"오히려 좋아","subtitle":"초긍정 마인드셋 인터넷 밈","meaning":"계획이 틀어지거나 예상 밖의 변수가 생겼을 때 당황하지 않고 오히려 장점을 찾아내며 유쾌하게 넘기는 표현입니다.","story":"전화위복을 현대 인터넷 감성으로 가장 짧고 힙하게 압축한 유행어입니다.","example":"방송 중 돌발 상황이 생겼을 때 분위기를 반전시키는 최고의 멘트입니다.","sourceCategory":"meme"},{"id":"culture_059","category":"culture","categoryLabel":"언어와 문화","title":"이왜진? (이게 왜 진짜야?)","subtitle":"인터넷 커뮤니티 감탄 밈","meaning":"합성이나 농담인 줄 알았던 황당하거나 놀라운 일이 실제로 일어났을 때 터뜨리는 감탄사입니다.","story":"기대하지 않았던 대박 결과나 신기한 우연이 겹쳤을 때 채팅창을 달구는 단골 표현입니다.","example":"놀라운 사실을 소개할 때 추임새로 활용하세요.","sourceCategory":"meme"},{"id":"culture_055","category":"culture","categoryLabel":"언어와 문화","title":"중꺾그마 (중요한 건 꺾였는데도 그냥 하는 마음)","subtitle":"박명수 어록 · 중꺾마 변형 밈","meaning":"멘탈이 한 번쯤 꺾이고 힘들더라도 거창한 비장함 대신 묵묵히하던 일을 계속해 나가는 현실적인 끈기를 뜻합니다.","story":"항상 열정이 넘칠 수만은 없는 현대인들에게 오히려 더 큰 공감과 위로를 준 변형 밈입니다.","example":"의욕이 떨어지는 날 가볍게 다시 시작할 때 써보세요.","sourceCategory":"meme"},{"id":"culture_051","category":"culture","categoryLabel":"언어와 문화","title":"중요한 것은 꺾이지 않는 마음 (중꺾마)","subtitle":"2022 롤드컵 DRX 데프트 인터뷰","meaning":"당장의 패배나 낮은 확률에 굴하지 않고 끝까지 도전하는 불굴의 정신력을 상징하는 국민 밈입니다.","story":"언더독의 기적적인 우승 서사와 맞물려 스포츠와 일상 전반의 응원 문구로 정착했습니다.","example":"힘든 과제를 앞두고 텐션을 끌어올릴 때 외쳐보세요.","sourceCategory":"meme"},{"id":"culture_053","category":"culture","categoryLabel":"언어와 문화","title":"폼 미쳤다","subtitle":"스포츠 중계 유래 극찬 밈","meaning":"누군가의 실력, 외모, 입담, 텐션이 최고조에 달해 감탄이 나올 만큼 완벽할 때 쓰는 표현입니다.","story":"축구 등 스포츠에서 선수의 컨디션(Form)이 절정일 때 쓰던 말이 일상 최고 칭찬어로 굳어졌습니다.","example":"시청자나 동료의 멋진 활약을 띄워줄 때 씁니다.","sourceCategory":"meme"},{"id":"culture_102","category":"culture","categoryLabel":"언어와 문화","title":"갓생 (God + 인생)","subtitle":"성실한 루틴 라이프스타일","meaning":"거창한 성공이 아니더라도 매일 기상, 운동, 청소, 공부 등 작은 목표를 성실히 실천하며 사는 보람찬 삶을 뜻합니다.","story":"작은 성취감을 통해 자존감을 지키는 현대인의 건강한 자기관리 문화입니다.","example":"오늘 실천한 작은 루틴을 서로 칭찬할 때 씁니다.","sourceCategory":"slang"},{"id":"culture_110","category":"culture","categoryLabel":"언어와 문화","title":"느좋 (느낌 좋은 / 분위기 있는)","subtitle":"감각적 칭찬 신조어","meaning":"딱 꼬집어 설명하기 어렵지만 전체적인 분위기, 색감, 음악, 바이브가 세련되고 기분 좋을 때 쓰는 표현입니다.","story":"디자인, 방송 화면, 카페 분위기 등을 직관적으로 칭찬할 때 널리 쓰입니다.","example":"멋진 배경이나 감성적인 순간에 가볍게 붙여보세요.","sourceCategory":"slang"},{"id":"culture_103","category":"culture","categoryLabel":"언어와 문화","title":"도파민 디톡스 (Dopamine Detox)","subtitle":"디지털 자극 휴식 트렌드","meaning":"자극적인 숏폼 영상과 알림에서 잠시 벗어나 산책, 독서, 명상으로 뇌의 피로를 씻어내는 활동입니다.","story":"집중력 회복과 수면의 질 향상을 위해 의식적으로 디지털 기기와 거리를 두는 습관입니다.","example":"주말 저녁 힐링 루틴을 이야기할 때 좋은 소재입니다.","sourceCategory":"slang"},{"id":"culture_108","category":"culture","categoryLabel":"언어와 문화","title":"디깅 (Digging — 깊게 파고들기)","subtitle":"취향 심화 탐구 트렌드","meaning":"자신이 좋아하는 특정 취미, 음악, 게임, 지식 분야를 광부가 보석을 캐듯 깊고 꾸준하게 파고들어 전문가가 되는 활동입니다.","story":"남들의 유행을 따라가기보다 나만의 깊은 취향 세계를 구축하는 문화를 뜻합니다.","example":"마니아적인 취미나 연구 주제를 이야기할 때 씁니다.","sourceCategory":"slang"},{"id":"culture_107","category":"culture","categoryLabel":"언어와 문화","title":"럭키비키 (초긍정 사고방식)","subtitle":"아이브 장원영식 긍정 화법","meaning":"어떤 불편하거나 아쉬운 상황이 생겨도 결국 나에게 더 유리하고 운이 좋게 풀린 것이라고 해석하는 유쾌한 사고방식입니다.","story":"단순한 위로를 넘어 일상의 작은 사건들을 모두 행운으로 바꾸는 유행어입니다.","example":"사소한 변수를 웃으며 넘길 때 최고의 유행어입니다.","sourceCategory":"slang"},{"id":"culture_106","category":"culture","categoryLabel":"언어와 문화","title":"소확성 (소소하지만 확실한 성취)","subtitle":"소확행에서 진화한 성취 키워드","meaning":"아침 이불 개기, 물 한 잔 마시기, 단어 하나 배우기처럼 아주 작지만 내가 직접 해내어 얻는 확실한 성취감을 뜻합니다.","story":"단순 소비로 얻는 기쁨보다 내 행동으로 얻는 성취가 훨씬 오래간다는 점에서 주목받습니다.","example":"하루 목표를 작게 쪼개어 달성할 때 써보세요.","sourceCategory":"slang"},{"id":"culture_105","category":"culture","categoryLabel":"언어와 문화","title":"스몰토크 (Small Talk)","subtitle":"가벼운 일상 대화 기술","meaning":"처음 만났거나 서먹한 자리에서 날씨, 음식, 취미 등 부담 없는 주제로 분위기를 부드럽게 푸는 대화법입니다.","story":"본격적인 소통에 앞서 상대방의 긴장을 낮춰주는 사교의 핵심 기술입니다.","example":"방송 오프닝에서 시청자들과 가볍게 인사를 나눌 때 활용하세요.","sourceCategory":"slang"},{"id":"culture_109","category":"culture","categoryLabel":"언어와 문화","title":"오하운 (오늘 하루 운동)","subtitle":"건강 인증 키워드","meaning":"헬스장뿐만 아니라 가벼운 동네 산책, 아침 스트레칭 등 오늘 내 몸을 위해 움직인 모든 활동을 기록하고 응원하는 말입니다.","story":"거창한 운동 강박을 덜어내고 매일 조금씩 몸을 움직이는 습관을 독려합니다.","example":"저녁 산책이나 스트레칭 후 상쾌함을 나눌 때 좋습니다.","sourceCategory":"slang"},{"id":"culture_101","category":"culture","categoryLabel":"언어와 문화","title":"추구미 (追求美)","subtitle":"추구하다 + 아름다움 미(美)","meaning":"내가 닮고 싶거나 지향하는 나만의 고유한 분위기, 스타일, 삶의 태도를 뜻하는 신조어입니다.","story":"단순한 외모를 넘어 내가 추구하는 라이프스타일 정체성을 표현하는 키워드입니다.","example":"방송 컨셉이나 개인의 취향을 소개할 때 질문 주제로 아주 좋습니다.","sourceCategory":"slang"},{"id":"culture_104","category":"culture","categoryLabel":"언어와 문화","title":"텍스트힙 (Text Hip)","subtitle":"글자(Text) + 멋지다(Hip)","meaning":"영상 시대에 오히려 책을 읽고 좋은 문장을 필사하거나 기록하는 행위를 가장 세련된 멋으로 여기는 트렌드입니다.","story":"독서와 지식 탐구를 자기표현의 힙한 문화로 즐기는 젊은 세대의 흐름을 보여줍니다.","example":"오늘 배운 명언이나 우리말을 기록할 때 딱 어울리는 단어입니다.","sourceCategory":"slang"},{"id":"relationship_034","category":"relationship","categoryLabel":"관계와 소통","title":"5가지 사랑의 언어","subtitle":"게리 채프먼 (관계 상담학)","meaning":"사람마다 사랑을 느끼는 핵심 통로가 ①칭찬의 말 ②함께하는 시간 ③선물 ④도움(봉사) ⑤스킨십 중 하나로 다르다는 이론입니다.","story":"내 방식이 아니라 상대방이 가장 중요하게 여기는 언어로 표현해야 사랑이 온전히 전달됩니다.","example":"연인의 진짜 취향과 감동 포인트를 찾을 때 필수 개념입니다.","sourceCategory":"love"},{"id":"relationship_032","category":"relationship","categoryLabel":"관계와 소통","title":"나 전달법 (I-Message 대화술)","subtitle":"토머스 고든 (관계 심리학)","meaning":"너는 왜 그래?라며 상대를 비난하는 대신, 나는 이럴 때 서운하고 걱정돼라고 내 감정을 주어로 말하는 대화법입니다.","story":"상대방의 방어기제를 자극하지 않고 내 진심을 온전히 전달해 싸움을 줄여줍니다.","example":"연인 사이에서 오해 없이 속마음을 전하는 최고의 기술입니다.","sourceCategory":"love"},{"id":"relationship_031","category":"relationship","categoryLabel":"관계와 소통","title":"단순 노출 효과 (에펠탑 효과)","subtitle":"로버트 자이언스 (심리학)","meaning":"처음엔 무심했더라도 자주 마주치고 연락이 반복될수록 자연스럽게 호감과 친밀감이 쌓이는 심리 법칙입니다.","story":"파리 에펠탑도 처음엔 흉물 취급을 받았으나 매일 보면서 파리의 상징이 된 데서 유래했습니다.","example":"거창한 이벤트보다 매일 건네는 따뜻한 안부의 힘을 설명해 줍니다.","sourceCategory":"love"},{"id":"relationship_036","category":"relationship","categoryLabel":"관계와 소통","title":"미러링 효과 (카멜레온 효과)","subtitle":"비언어적 공감 심리학","meaning":"호감 있는 사람의 말투, 표정, 고개 끄덕임이나 음료 마시는 타이밍을 자연스럽게 따라 하면 친밀감이 급상승하는 현상입니다.","story":"뇌의 거울신경세포가 작동하여 상대방이 무의식중에 나랑 잘 통하는 사람이라고 느끼게 만듭니다.","example":"소개팅이나 첫 만남에서 어색함을 줄이는 실전 팁입니다.","sourceCategory":"love"},{"id":"relationship_039","category":"relationship","categoryLabel":"관계와 소통","title":"빈틈 효과 (실수 효과 — 인간미의 매력)","subtitle":"엘리엇 애런슨 (심리학)","meaning":"너무 완벽해서 다가가기 어려운 사람보다 가끔 사소한 허당미와 빈틈을 보여주는 사람이 훨씬 매력적으로 느껴지는 현상입니다.","story":"완벽한 모습 뒤에 숨겨진 귀여운 반전 매력이 상대방의 경계심을 허물어뜨립니다.","example":"첫인상에서 너무 긴장할 필요 없다는 위로를 줍니다.","sourceCategory":"love"},{"id":"relationship_035","category":"relationship","categoryLabel":"관계와 소통","title":"안정형 애착 (건강한 독립과 신뢰)","subtitle":"애착 이론","meaning":"함께할 때는 다정하게 몰입하고 각자의 시간을 보낼 때는 불안해하지 않으며 서로를 믿어주는 성숙한 연애 태도입니다.","story":"집착이나 회피 없이 두 사람 모두 정서적 평온함을 누리는 가장 이상적인 관계 모델입니다.","example":"오래가는 편안한 연애의 조건을 이야기할 때 핵심이 됩니다.","sourceCategory":"love"},{"id":"relationship_040","category":"relationship","categoryLabel":"관계와 소통","title":"정서적 조율 (감정에 먼저 공감하기)","subtitle":"현대 커플 심리학","meaning":"연인이 힘든 일을 털어놓을 때 성급하게 해결책을 가르치려 하기보다 먼저 그 감정에 깊이 공감해 주는 태도입니다.","story":"대부분의 고민 토로는 정답을 몰라서가 아니라 내 편에게 위로받고 싶어서 시작됩니다.","example":"T와 F 성향 연인이 서로를 이해할 때 가장 중요한 키워드입니다.","sourceCategory":"love"},{"id":"relationship_037","category":"relationship","categoryLabel":"관계와 소통","title":"프레이밍 효과 (긍정적 관점 제시)","subtitle":"행동경제학 · 연애 대화법","meaning":"같은 말이라도 부정적 틀 대신 긍정적 틀로 표현할 때 상대방의 수용도와 호감이 완전히 달라지는 현상입니다.","story":"왜 이렇게 늦었어? 대신 와줘서 고마워, 보고 싶었어라고 말할 때 데이트 전체 분위기가 살아납니다.","example":"말 한마디의 온도가 관계를 바꾸는 원리입니다.","sourceCategory":"love"},{"id":"relationship_038","category":"relationship","categoryLabel":"관계와 소통","title":"피그말리온 효과 (기대와 칭찬의 마법)","subtitle":"로젠탈 & 제이콥슨","meaning":"상대방의 장점을 믿어주고 따뜻하게 칭찬할수록 상대방도 그 기대에 부응해 더 멋지고 다정한 사람으로 변하는 현상입니다.","story":"단점을 지적해 고치려 하기보다 잘했을 때 크게 칭찬하는 것이 관계를 바꾸는 지름길입니다.","example":"연인을 내 편으로 만드는 가장 현명한 칭찬법입니다.","sourceCategory":"love"},{"id":"relationship_033","category":"relationship","categoryLabel":"관계와 소통","title":"흔들다리 효과 (두근거림의 착각)","subtitle":"더튼 & 아론 현수교 실험","meaning":"약간 긴장되거나 스릴 있는 상황을 함께 겪을 때 뛰는 심장 박동을 상대에게 반해서 설레는 감정으로 느끼는 현상입니다.","story":"안정적인 다리보다 흔들리는 구름다리에서 만난 이성에게 호감도가 훨씬 높았던 실험입니다.","example":"액티브한 데이트 코스가 썸 성공률을 높이는 과학적 이유입니다.","sourceCategory":"love"},{"id":"relationship_047","category":"relationship","categoryLabel":"관계와 소통","title":"가사 노동의 가시화와 상호 감사","subtitle":"현대 맞벌이·가족 사회학","meaning":"집안일은 티가 잘 안 나지만 안 하면 일상이 멈추는 핵심 노동이므로, 당연하게 여기지 않고 서로 구체적으로 고마움을 표현하는 문화입니다.","story":"설거지해 줘서 고마워라는 짧은 한마디가 가사 피로도를 절반 이하로 낮춰줍니다.","example":"일상의 평화를 지키는 가장 쉬운 실천법입니다.","sourceCategory":"marriage"},{"id":"relationship_041","category":"relationship","categoryLabel":"관계와 소통","title":"가트맨의 마법의 비율 5:1 법칙","subtitle":"존 가트맨 박사 (부부 연구 40년)","meaning":"행복하게 해로하는 부부는 갈등 상황에서도 부정적인 말 1번당 긍정적인 표현(미소·칭찬·유머)을 5번 이상 주고받는다는 법칙입니다.","story":"수천 쌍의 부부를 장기 추적해 밝혀낸 부부 화목의 가장 과학적인 지표입니다.","example":"평소 작은 고마움 표시로 감정 은행 잔고를 쌓아야 하는 이유입니다.","sourceCategory":"marriage"},{"id":"relationship_042","category":"relationship","categoryLabel":"관계와 소통","title":"거안제미 (擧案齊眉 — 부부 상호 존중)","subtitle":"《후한서》 양홍과 맹광 고사","meaning":"가장 가깝고 편한 부부 사이일수록 서로를 귀한 손님 대하듯 예의와 존중을 끝까지 잃지 않는 태도를 뜻합니다.","story":"가족이라는 이유로 말투가 거칠어지지 않고 고마움을 표현할 때 평생 설렘과 신뢰가 유지됩니다.","example":"오래가는 잉꼬부부의 제1원칙으로 꼽힙니다.","sourceCategory":"marriage"},{"id":"relationship_043","category":"relationship","categoryLabel":"관계와 소통","title":"결혼은 같은 방향을 바라보는 원팀(One Team)","subtitle":"앙투안 드 생텍쥐페리 응용","meaning":"연애가 서로를 마주 보며 설레는 것이라면 결혼은 나란히 서서 인생의 목표와 파도를 함께 헤쳐 나가는 팀워크라는 뜻입니다.","story":"부부 사이에 문제가 생겼을 때 상대를 이기려 하지 않고 문제를 함께 해결하려는 관점 전환을 돕습니다.","example":"현명한 결혼관을 이야기할 때 가장 많이 인용되는 구절입니다.","sourceCategory":"marriage"},{"id":"relationship_044","category":"relationship","categoryLabel":"관계와 소통","title":"공동 재무 목표와 ‘각자의 숨통 예산’","subtitle":"부부 재테크 황금률","meaning":"가계의 큰 저축과 고정비는 투명하게 합쳐서 관리하되, 서로 간섭 없이 자유롭게 쓸 수 있는 개인 용돈을 반드시 보장하는 원칙입니다.","story":"모든 소액 소비까지 통제하려 하면 정서적 피로가 쌓이므로 공동 목표와 자율성의 균형이 필수입니다.","example":"결혼 후 경제권 관리 토크에서 가장 현실적인 해법입니다.","sourceCategory":"marriage"},{"id":"relationship_050","category":"relationship","categoryLabel":"관계와 소통","title":"배우자의 ‘삶의 꿈’ 응원하기","subtitle":"가트맨 연구소 핵심 처방","meaning":"결혼이라는 테두리 안에서도 배우자가 개인으로서 품고 있는 취미, 공부, 커리어의 꿈을 진심으로 지지해 주는 태도입니다.","story":"결혼 덕분에 내 인생이 더 넓어졌다고 느낄 때 두 사람의 유대감은 흔들리지 않습니다.","example":"서로를 성장시키는 동반자 관계를 뜻합니다.","sourceCategory":"marriage"},{"id":"relationship_048","category":"relationship","categoryLabel":"관계와 소통","title":"양가 경계선 존중과 부부 중심성","subtitle":"가족 치료 핵심 원칙","meaning":"결혼 후에는 원가족(부모·형제)보다 배우자와의 관계가 제1순위의 중심축이 되어야 하며 양가 이슈는 각자 완충 역할을 맡는 원칙입니다.","story":"배우자의 서운함을 먼저 대변해 주고 내 가족 문제는 내가 부드럽게 중재할 때 갈등이 사라집니다.","example":"명절이나 가족 행사 전후로 꼭 기억해야 할 지혜입니다.","sourceCategory":"marriage"},{"id":"relationship_046","category":"relationship","categoryLabel":"관계와 소통","title":"요구-철회 패턴 끊어내기","subtitle":"부부 갈등 해결 심리학","meaning":"한쪽은 다그치며 요구하고 다른 한쪽은 입을 닫고 동굴로 숨어버리는 악순환을 멈추고, 20분 휴식 후 차분히 대화하는 규칙입니다.","story":"감정이 격해졌을 때는 잠시 타임아웃을 선언해 맥박을 가라앉힌 뒤 대화해야 상처를 주지 않습니다.","example":"부부 싸움을 현명하게 다루는 실전 매뉴얼입니다.","sourceCategory":"marriage"},{"id":"relationship_049","category":"relationship","categoryLabel":"관계와 소통","title":"작은 리추얼(의식) 함께 만들기","subtitle":"행복한 부부의 습관 연구","meaning":"주말 아침 함께 커피 내리기, 저녁 식사 후 20분 동네 산책하기처럼 두 사람만의 작고 규칙적인 일상을 공유하는 것입니다.","story":"거창한 해외여행보다 매일 반복되는 20분의 다정한 루틴이 결혼 만족도를 결정합니다.","example":"부부나 장기 연인에게 추천하기 좋은 습관입니다.","sourceCategory":"marriage"},{"id":"relationship_045","category":"relationship","categoryLabel":"관계와 소통","title":"정서적 안전기지 (Secure Base)","subtitle":"존 볼비 · 부부 상담학","meaning":"밖에서 아무리 치열하고 지치는 하루를 보냈더라도 집 문을 열고 들어왔을 때 무조건 내 편이 되어주는 평온한 안식처를 뜻합니다.","story":"결혼의 가장 큰 가치는 조건의 합산이 아니라 세상에서 가장 안전한 마음의 집을 함께 짓는 데 있습니다.","example":"배우자의 존재 의미를 가장 따뜻하게 설명한 개념입니다.","sourceCategory":"marriage"}];
const CATEGORIES = [
  {id:"all",name:"전체"},
  {id:"wisdom",name:"문장과 지혜"},
  {id:"history",name:"역사"},
  {id:"science",name:"과학"},
  {id:"culture",name:"언어와 문화"},
  {id:"relationship",name:"관계와 소통"}
];
const $ = s => document.querySelector(s);
let category = "all", current = null, historyStack = [], deck = [], deckIndex = -1;
const todayKey = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const hash = s => { let h=2166136261; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);} return h>>>0; };
function pool(){return KNOWLEDGE.filter(x=>category==="all"||x.category===category);}
function pickToday(){
 const d=todayKey(), list=KNOWLEDGE; return list[hash(d)%list.length];
}
function setCard(item, push=true){
 if(!item)return;
 if(push && current && current.id!==item.id) historyStack.push(current);
 current=item;
 $("#content").innerHTML=`
 <article class="card">
  <div class="cardtop"><div class="meta"><span>${item.categoryLabel}</span><i class="dot"></i><span>하루 지식</span></div>
  <h2 class="title">${esc(item.title)}</h2><div class="subtitle">${esc(item.subtitle||"")}</div></div>
  <div class="meaning">${esc(item.meaning||"")}</div>
  <div class="details">
   <section class="detail"><h3>배경과 맥락</h3><p>${esc(item.story||"등록된 배경 설명이 없습니다.")}</p></section>
   <section class="detail"><h3>생활 속 연결</h3><p>${esc(item.example||"등록된 활용 예시가 없습니다.")}</p></section>
  </div>
  <div class="controls"><div class="controlgroup"><button class="ghost" id="prev" ${historyStack.length?"":"disabled"}>← 이전</button><button class="ghost" id="next">다른 지식 뽑기 ↻</button></div><div class="status">${pool().length}개 중 선택 · ${KNOWLEDGE.indexOf(item)+1}/${KNOWLEDGE.length}</div></div>
 </article>`;
 $("#prev").onclick=goBack; $("#next").onclick=nextCard;
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function makeDeck(){
 deck=pool().slice(); for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
 if(current && deck.length>1 && deck[0].id===current.id) [deck[0],deck[1]]=[deck[1],deck[0]];
 deckIndex=-1;
}
function nextCard(){
 if(!deck.length || deckIndex>=deck.length-1) makeDeck();
 deckIndex++; setCard(deck[deckIndex]);
}
function goBack(){if(!historyStack.length)return;const item=historyStack.pop();setCard(item,false);}
function renderFilters(){
 $("#filters").innerHTML=CATEGORIES.map(c=>`<button class="filter ${category===c.id?"active":""}" data-id="${c.id}">${c.name}</button>`).join("");
 document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{category=b.dataset.id;historyStack=[];makeDeck();renderFilters();nextCard();});
}
function showToday(){
 const item=pickToday(); category="all";historyStack=[];renderFilters();setCard(item,false);
}
$("#showToday").onclick=showToday;
$("#todayTitle").textContent=pickToday().title;
$("#todayDate").textContent=`${todayKey()} · 날짜가 바뀌면 오늘의 지식도 바뀝니다`;
$("#totalCount").textContent=KNOWLEDGE.length;
renderFilters();makeDeck();setCard(pickToday(),false);
</script>
</body>
</html>
